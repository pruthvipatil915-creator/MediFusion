spring.application.name=backend

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1709}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA Configuration
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET:medaiprojectsecretkeyforjwtauthentication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# External AI & ML Services
# ==========================
gemini.api.key=${GEMINI_API_KEY:}
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}